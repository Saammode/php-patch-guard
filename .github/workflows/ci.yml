name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: shellcheck -S warning php-patch-guard.sh tests/test_logic.sh

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: bash tests/test_logic.sh

  check-mode-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run --check on the runner's PHP (must not error out)
        run: |
          chmod +x php-patch-guard.sh
          # Check mode returns 0 (patched) or 10 (needs update); both are fine.
          set +e
          ./php-patch-guard.sh --check --no-color
          rc=$?
          echo "exit=$rc"
          if [[ "$rc" != "0" && "$rc" != "10" ]]; then exit 1; fi
      - name: JSON mode is valid JSON
        run: ./php-patch-guard.sh --json | python3 -m json.tool > /dev/null
